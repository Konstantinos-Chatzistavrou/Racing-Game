<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Night Run</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="view"></canvas>
  <div id="loading">Loading…</div>
  <div id="rotate">Rotate your phone to landscape ↻</div>
  <div id="hud" hidden>
    <div id="perf"></div>
    <div id="laps">
      <div class="row"><span class="k">LAP</span><span id="lapno">1</span></div>
      <div class="row big"><span id="lapcur">0:00.000</span></div>
      <div class="row"><span class="k">LAST</span><span id="laplast">—</span></div>
      <div class="row"><span class="k">BEST</span><span id="lapbest">—</span></div>
    </div>
    <div id="toast"></div>
    <div id="dash">
      <svg id="gauge" viewBox="0 0 240 240" aria-hidden="true">
        <g id="ticks"></g>
        <path id="revtrack" fill="none" stroke-width="5" />
        <path id="revfill" fill="none" stroke-width="5" />
        <line id="needle" x1="120" y1="120" x2="120" y2="34" />
        <circle cx="120" cy="120" r="7" class="hub" />
      </svg>
      <div id="speed">0</div><div id="unit">km/h</div>
      <div id="gear">N</div>
      <div id="assists"></div>
      <div id="damage"></div>
    </div>
    <div id="help">W/S throttle · brake &nbsp; A/D steer &nbsp; Q/E shift &nbsp; Space handbrake &nbsp; R reset/repair &nbsp; C camera &nbsp; 1 ABS · 2 TC · 3 ESC · 5 auto gears &nbsp; H hide</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
